<!DOCTYPE html>
<html>
<head>
    <title>My M-Pesa Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #4CAF50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Payment Dashboard</h2>
    <a href="/logout" style="background-color: #f44336; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; float: right; margin-top: -45px;">Log Out</a>
    <p>Here are all the payments received via M-Pesa.</p>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Receipt No.</th>
                <th>Amount (KES)</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for payment in payments %}
            <tr>
                <td>{{ payment.id }}</td>
                <td>{{ payment.receipt_number }}</td>
                <td>{{ payment.amount }}</td>
                <td class="success">{{ payment.status }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4">No payments received yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
